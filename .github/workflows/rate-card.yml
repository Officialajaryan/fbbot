name: rate-card
on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 6:00 AM Singapore time (next day), every day
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-dejavu-core libraqm0 libfribidi0
      - run: pip install -r requirements.txt
      - run: python rate_card.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          PAGE_NAME: ${{ secrets.PAGE_NAME }}
          FB_PAGE_URL: ${{ secrets.FB_PAGE_URL }}
          RATE_AUTOPOST: "true"   # posts straight to Facebook, no Telegram confirmation
